# Corre el linter y las pruebas en cada rama y en cada pull request.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - name: Linter oficial de Obsidian
        run: npx eslint src/
      - name: Tipos
        run: npm run typecheck
      - name: Construir y probar
        run: npm test
